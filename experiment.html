<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InteroMap – experiment</title>
<style>
  :root { --bg:#7f7f7f; --blank:#7f7f7f; --panel:#ffffff; --ink:#1c1c1c; --accent:#2563eb; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; }
  body {
    background: var(--bg);                 /* neutral mid-grey: low-arousal, standard for affective tasks */
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    height:100vh; overflow:hidden;
  }
  #app { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .card {
    background:var(--panel); border-radius:14px; padding:36px 40px; max-width:640px;
    box-shadow:0 10px 40px rgba(0,0,0,.25); text-align:center; line-height:1.5;
  }
  .consent-card { max-width:760px; max-height:calc(100vh - 32px); overflow-y:auto; margin:16px; text-align:left; }
  .consent-choice { display:flex; align-items:flex-start; gap:12px; margin:20px 0; cursor:pointer; }
  .consent-choice input { flex:0 0 auto; width:1.2rem; height:1.2rem; margin:3px 0 0; }
  .card h1 { font-size:1.4rem; margin:0 0 .6em; }
  .card p { margin:.5em 0; }
  .btn {
    display:inline-block; margin:.4em; padding:.7em 1.4em; border:0; border-radius:8px;
    background:var(--accent); color:#fff; font-size:1rem; cursor:pointer;
  }
  .btn.secondary { background:#475569; }
  .btn:disabled { opacity:.45; cursor:default; }
  input[type=text] { padding:.6em .8em; font-size:1rem; border:1px solid #cbd5e1; border-radius:8px; width:70%; }
  #blank { width:100%; height:100%; background:var(--blank); }   /* inter-stimulus interval */
  #picwrap { display:flex; align-items:center; justify-content:center; width:100%; height:100%; }
  #picwrap img { max-width:80vw; max-height:80vh; object-fit:contain; box-shadow:0 6px 30px rgba(0,0,0,.35); }
  #maplayout { display:flex; flex-direction:column; width:100%; height:100%; }
  #mapframe { flex:1 1 auto; width:100%; border:0; background:#fff; }
  #mapbar {
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:10px 18px; background:#e5e7eb;
  }
  #mapbar .hint { font-size:.9rem; color:#374151; }
  .progress { font-size:.85rem; color:#fff; background:rgba(0,0,0,.65); padding:3px 7px;
    border-radius:4px; position:fixed; top:10px; left:14px; }
  .progress:empty { display:none; }
  .rating-screen { width:100%; height:100%; overflow:auto; }
  .rating-layout { display:flex; align-items:center; justify-content:center;
    min-height:100%; padding:38px 28px 24px; }
  .rating-picture { margin:0; text-align:center; }
  .rating-picture img { max-width:80vw; max-height:80vh; object-fit:contain; box-shadow:0 6px 30px rgba(0,0,0,.35); }
  .rating-card { width:100%; max-width:820px; padding:24px 28px; }
  /* Display each row of the supplied 850 × 415 image without altering the asset. */
  .sam-illustration { position:relative; overflow:hidden; aspect-ratio:700 / 135; }
  .sam-illustration img { position:absolute; width:121.428571%; max-width:none; height:auto;
    left:-18.571429%; top:-29.629630%; }
  .sam-illustration.arousal img { top:-151.851852%; }
  .rating-scale.sam .rating-choices { margin-inline:2.428571%; }
  .rating-scale { border:0; border-top:1px solid #d1d5db; padding:12px 0 0; margin:18px 0; text-align:left; min-width:0; }
  .rating-scale legend { font-weight:600; padding:0 6px 0 0; }
  .rating-scale p { font-size:.95rem; margin:0 0 8px; }
  .rating-choices { display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); gap:4px; }
  .rating-choice { position:relative; cursor:pointer; }
  .rating-choice input { position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .rating-choice span { display:flex; align-items:center; justify-content:center; min-height:42px;
    border:1px solid #94a3b8; border-radius:8px; background:#fff; font-size:1rem; }
  .rating-choice input:checked + span { background:var(--accent); color:white; border-color:var(--accent); }
  .rating-choice input:focus-visible + span { outline:3px solid #1c1c1c; outline-offset:2px; }
  .rating-anchors { display:flex; justify-content:space-between; gap:12px; margin-top:6px; font-size:.875rem; }
  .rating-anchors span { max-width:46%; }
  .rating-anchors span:last-child { text-align:right; }
  .rating-image-status { color:white; }
  @media (max-width:900px) {
    .rating-layout { padding:38px 16px 20px; }
    .rating-card { margin:auto; padding:22px 18px; }
  }
</style>
</head>

const CONSENT = {

  provisional: true,
  title: "Informace o studii a souhlas s účastí",

  ],

// All rating rows run from 9 on the left to 1 on the right.

const MANIKINS_IMAGE = "images/manikins.png";
const BASELINE = { variable: "baseline", image: "" };
const PRACTICE = { variable: "practice", image: "" };
if (CONFIG.trials.some(trial => [BASELINE.variable, PRACTICE.variable].includes(trial.variable))) {
  throw new Error('The trial variables "baseline" and "practice" are reserved.');
}
const RATING_SCALES = [
  { key: "valence", label: "Příjemnost (valence)", manikin: true,
    question: "Jak příjemný nebo nepříjemný pocit ve vás obrázek vyvolává?",
    low: "Velmi nepříjemný", high: "Velmi příjemný", midpoint: "5 = neutrální" },

];

const app  = document.getElementById("app");
const prog = document.getElementById("progress");

const state = {
  participant: "",
  consent: null,
  practice: { completed: false, durationMs: null },
  persona: CONFIG.persona,
  order: createTrialOrder(CONFIG.trials),
  idx: 0,
  results: {},          // variable -> latest output JSON string from InteroMap
  meta: {},             // variable -> { image, persona, pictureOnset, mapOnset, mapDurationMs }
  pictureRatings: [],
  phase: "consent"
};

// Fisher–Yates at two levels: shuffle whole blocks, then images inside each block.
// Copy arrays so the stimulus definitions and their stable identifiers never change.
function shuffled(items, random = Math.random) {
  const result = [...items];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function createTrialOrder(trials, random = Math.random) {
  const blocks = new Map();
  trials.forEach((trial, index) => {
    if (!blocks.has(trial.block)) blocks.set(trial.block, []);
    blocks.get(trial.block).push(index);
  });
  return shuffled([...blocks.values()], random).flatMap(block => shuffled(block, random));
}

// All positions are one-based. Baseline is outside the randomized picture blocks.
function blockMetadata(position) {
  const preceding = state.order.slice(0, position + 1).map(index => CONFIG.trials[index]);
  const trial = preceding[position];
  return {
    block: trial.block,
    condition: trial.condition,
    blockPosition: new Set(preceding.map(item => item.block)).size,
    positionWithinBlock: preceding.filter(item => item.block === trial.block).length
  };
}

/* ---- capture InteroMap output (fires after every stroke; keep the latest) ---- */
let activeVariable = null;
window.addEventListener("message", (event) => {
  const d = event.data;
  const frame = document.getElementById("mapframe");
  if (!frame || event.source !== frame.contentWindow ||
      event.origin !== new URL(CONFIG.toolPath, location.href).origin) return;
  if (!d || d.event !== "interomap_data" || !activeVariable || d.variable !== activeVariable) return;
  if (activeVariable === PRACTICE.variable) return; // Practice drawings are never research responses.
  state.results[d.variable] = d.output; // cumulative JSON string of all strokes
});

/* ---------------------------- screens ---------------------------- */
function clear() { app.innerHTML = ""; activeVariable = null; }

function screenConsent() {
  clear();
  state.phase = "consent";
  prog.textContent = "";
  const card = document.createElement("div");
  card.className = "card consent-card";
  const heading = document.createElement("h1");
  heading.textContent = CONSENT.title;
  card.appendChild(heading);
  for (const text of CONSENT.paragraphs) {
    const paragraph = document.createElement("p");
    paragraph.textContent = text;
    card.appendChild(paragraph);
  }
  const label = document.createElement("label");
  label.className = "consent-choice";
  const checkbox = document.createElement("input");
  checkbox.id = "consent-checkbox";
  checkbox.type = "checkbox";
  checkbox.checked = false;
  checkbox.required = true;
  const description = document.createElement("span");
  description.textContent = CONSENT.choice;
  label.appendChild(checkbox); label.appendChild(description);
  const next = document.createElement("button");
  next.id = "consent-continue";
  next.className = "btn";
  next.textContent = CONSENT.continue;
  next.disabled = true;
  checkbox.addEventListener("change", () => { next.disabled = !checkbox.checked; });
  next.addEventListener("click", () => {
    if (!checkbox.checked || next.disabled) return;
    next.disabled = true;
    state.consent = { accepted: true, version: CONSENT.version, provisional: CONSENT.provisional,
      acceptedAt: new Date().toISOString() };
    screenIntro();
  });
  card.appendChild(label); card.appendChild(next); app.appendChild(card);
}

function screenIntro() {
  if (!state.consent?.accepted) return screenConsent();
  clear();
  state.phase = "intro";
  prog.textContent = "";
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    `<h1>${UI.title}</h1><p>${UI.intro}</p>` +
    (CONFIG.askParticipantId
      ? `<p>${UI.idLabel}</p><p><input type="text" id="pid" maxlength="200" autocomplete="off"></p>` : "") +
    (CONFIG.choosePersonaOnce
      ? `<p>${UI.choosePersona}</p>
         <p><button class="btn secondary" data-persona="female">${UI.female}</button>
            <button class="btn secondary" data-persona="male">${UI.male}</button></p>` : "");
  const startBtn = document.createElement("button");
  startBtn.id = "participant-start";
  startBtn.className = "btn"; startBtn.textContent = UI.start;
  startBtn.disabled = CONFIG.choosePersonaOnce;   // enabled once a persona is chosen
  card.appendChild(startBtn);
  app.appendChild(card);

  if (CONFIG.choosePersonaOnce) {
    card.querySelectorAll("[data-persona]").forEach(b => b.addEventListener("click", () => {
      state.persona = b.dataset.persona;
      card.querySelectorAll("[data-persona]").forEach(x =>
        x.style.outline = (x === b) ? "3px solid var(--accent)" : "none");
      startBtn.disabled = false;
    }));
  }
  startBtn.addEventListener("click", () => {
    if (startBtn.disabled) return;
    startBtn.disabled = true;
    if (CONFIG.askParticipantId) state.participant = (document.getElementById("pid").value || "").trim();
    screenPracticeIntro();
  });
}

function screenPracticeIntro() {
  clear();
  state.phase = "practiceIntro";
  prog.textContent = "";
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h1>${UI.practiceTitle}</h1><p>${UI.practiceIntro}</p><p>${UI.practiceInstructions}</p>`;
  const next = document.createElement("button");
  next.id = "practice-start";
  next.className = "btn";
  next.textContent = UI.practiceStart;
  next.addEventListener("click", () => {
    if (next.disabled) return;
    next.disabled = true;
    state.phase = "practice";
    prog.textContent = "Nácvik";
    state.meta[PRACTICE.variable] = { image: "", persona: state.persona };
    showMap(PRACTICE, "practice");
  });
  card.appendChild(next); app.appendChild(card);
}

function screenBaselineIntro() {
  clear();
  state.phase = "baselineIntro";
  prog.textContent = "";
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h1>${UI.baselineTitle}</h1><p>${UI.baselineIntro}</p><p>${UI.baselineInstructions}</p>`;
  const next = document.createElement("button");
  next.id = "baseline-start";
  next.className = "btn";

    showMap(BASELINE, "baseline");
  });
  card.appendChild(next);
  app.appendChild(card);
}

/* blank inter-stimulus interval, then call next() */
function showBlank(next) {
  clear();
  const b = document.createElement("div");
  b.id = "blank";
  app.appendChild(b);
  setTimeout(next, CONFIG.blankMs);
}

function runTrial(i) {
  state.idx = i;
  if (i >= state.order.length) return screenRatingsIntro();
  state.phase = "mapping";
  prog.textContent = `${i + 1} / ${state.order.length}`;
  const trial = CONFIG.trials[state.order[i]];
  state.meta[trial.variable] = {
    image: trial.image,
    persona: CONFIG.choosePersonaOnce ? state.persona : (trial.persona || CONFIG.persona)
  };
  showPicture(trial);                                  // -> blank -> map
}

function showPicture(trial) {
  clear();
  const wrap = document.createElement("div");
  wrap.id = "picwrap";
  const img = document.createElement("img");
  img.id = "mapping-image";
  img.alt = "";
  img.hidden = true;
  const imageStatus = document.createElement("p");
  imageStatus.className = "rating-image-status";
  imageStatus.setAttribute("role", "status");
  imageStatus.textContent = UI.imageLoading;
  const reload = document.createElement("button");
  reload.id = "mapping-reload";
  reload.className = "btn secondary";
  reload.textContent = UI.reloadImage;
  reload.hidden = true;
  wrap.appendChild(img); wrap.appendChild(imageStatus); wrap.appendChild(reload);
  app.appendChild(wrap);
  let started = false;
  img.addEventListener("load", () => {
    if (started) return;
    started = true;
    imageStatus.hidden = true; reload.hidden = true; img.hidden = false;
    requestAnimationFrame(() => {
      state.meta[trial.variable].pictureOnset = performance.now();
      setTimeout(() => showBlank(() => showMap(trial)), CONFIG.pictureMs);
    });
  });
  img.addEventListener("error", () => {
    imageStatus.textContent = UI.imageFailed;
    reload.hidden = false;
  });
  reload.addEventListener("click", () => {
    reload.hidden = true; imageStatus.textContent = UI.imageLoading;
    const url = new URL(trial.image, location.href);
    url.searchParams.set("retry", Date.now()); img.src = url.href;
  });
  // Begin the six-second exposure only after the selected image has loaded.
  img.src = trial.image;
}

function showMap(trial, mapType = "picture") {
  const isPractice = mapType === "practice";
  const hintText = isPractice ? UI.practiceHint : mapType === "baseline" ? UI.baselineHint : UI.mapHint;
  clear();
  const persona = state.meta[trial.variable].persona;
  activeVariable = trial.variable;
  state.meta[trial.variable].mapOnset = performance.now();

  const layout = document.createElement("div");
  layout.id = "maplayout";

  const frame = document.createElement("iframe");
  frame.id = "mapframe"; frame.title = "InteroMap";
  // nonce (&_=) guarantees a fresh, empty map each trial even if params repeat
  frame.src = `${CONFIG.toolPath}?lang=${CONFIG.lang}&persona=${persona}` +
              `&variable=${encodeURIComponent(trial.variable)}&_=${Date.now()}`;

  const bar = document.createElement("div");
  bar.id = "mapbar";
  const hint = document.createElement("span");
  hint.className = "hint"; hint.textContent = hintText;
  const next = document.createElement("button");
  next.id = "map-next";
  next.className = "btn"; next.textContent = isPractice ? UI.practiceDone : UI.continueMap;
  bar.appendChild(hint); bar.appendChild(next);

  layout.appendChild(frame); layout.appendChild(bar);
  app.appendChild(layout);

  let advanced = false;
  const advance = () => {
    if (advanced || next.disabled) return;
    advanced = true; next.disabled = true;
    const m = state.meta[trial.variable];
    m.mapDurationMs = Math.round(performance.now() - m.mapOnset);
    if (isPractice) {
      state.practice = { completed: true, durationMs: m.mapDurationMs };
      delete state.meta[PRACTICE.variable];
      delete state.results[PRACTICE.variable];
      screenBaselineIntro();
    } else {
      showBlank(() => runTrial(mapType === "baseline" ? 0 : state.idx + 1));
    }
  };

  if (!isPractice && CONFIG.minMapSeconds > 0) {
    next.disabled = true;
    const t0 = performance.now();
    const tick = () => {
      const left = CONFIG.minMapSeconds - (performance.now() - t0) / 1000;
      if (left > 0) { hint.textContent = `${UI.waitHint} (${Math.ceil(left)} s)`; requestAnimationFrame(tick); }
      else { hint.textContent = hintText; next.disabled = false; }
    };
    requestAnimationFrame(tick);
  }
  next.addEventListener("click", advance);
}

/* ---------------------------- picture ratings ---------------------------- */
function screenRatingsIntro() {
  clear();
  state.phase = "ratingIntro";
  prog.textContent = "";
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h1>${UI.ratingTitle}</h1><p>${UI.ratingIntro}</p><p>${UI.ratingInstructions}</p>`;
  const next = document.createElement("button");
  next.id = "ratings-start";
  next.className = "btn";
  next.textContent = UI.next;
  next.addEventListener("click", () => { next.disabled = true; showRatingPicture(0); });
  card.appendChild(next);
  app.appendChild(card);
}

function showRatingPreparation(i) {
  clear();
  state.phase = "ratingPreparation";
  prog.textContent = "";
  const card = document.createElement("div");
  card.id = "rating-preparation";
  card.className = "card";
  card.textContent = UI.ratingPreparation;
  app.appendChild(card);
  setTimeout(() => showRatingPicture(i), CONFIG.ratingPreparationMs);
}

function showRatingPicture(i) {
  if (i >= state.order.length) return screenEnd();
  clear();
  state.phase = "ratingPicture";
  const trial = CONFIG.trials[state.order[i]];
  prog.textContent = `Hodnocení ${i + 1} / ${state.order.length}`;
  const picture = document.createElement("figure");
  picture.className = "rating-picture";
  const img = document.createElement("img");
  img.id = "rating-image";
  img.alt = `Obrázek ${i + 1} k hodnocení`;
  img.hidden = true;
  // Load the rating illustrations before beginning the timed exposure.
  const manikins = document.createElement("img");
  manikins.id = "rating-manikins-preload";
  manikins.hidden = true;
  manikins.alt = "";
  const imageStatus = document.createElement("p");
  imageStatus.className = "rating-image-status";
  imageStatus.setAttribute("role", "status");
  imageStatus.textContent = UI.imageLoading;
  const reload = document.createElement("button");
  reload.id = "rating-reload";
  reload.className = "btn secondary";
  reload.textContent = UI.reloadImage;
  reload.hidden = true;
  picture.appendChild(img); picture.appendChild(imageStatus); picture.appendChild(reload);
  picture.appendChild(manikins);
  app.appendChild(picture);
  let pictureLoaded = false, manikinsLoaded = false, started = false;
  const startExposure = () => {
    if (started || !pictureLoaded || !manikinsLoaded) return;
    started = true;
    imageStatus.hidden = true; reload.hidden = true;
    img.hidden = false;
    requestAnimationFrame(() => {
      const pictureOnset = performance.now();
      setTimeout(() => showRating(i, Math.round(performance.now() - pictureOnset)), CONFIG.ratingPictureMs);
    });
  };
  const imageError = () => {
    imageStatus.hidden = false; imageStatus.textContent = UI.imageFailed;
    reload.hidden = false;
  };
  img.addEventListener("load", () => { pictureLoaded = true; startExposure(); });
  manikins.addEventListener("load", () => { manikinsLoaded = true; startExposure(); });
  img.addEventListener("error", imageError);
  manikins.addEventListener("error", imageError);
  reload.addEventListener("click", () => {
    reload.hidden = true; imageStatus.textContent = UI.imageLoading;
    for (const [image, path, loaded] of [[img, trial.image, pictureLoaded], [manikins, MANIKINS_IMAGE, manikinsLoaded]]) {
      if (loaded) continue;
      const url = new URL(path, location.href);
      url.searchParams.set("retry", Date.now()); image.src = url.href;
    }
  });
  img.src = trial.image;
  manikins.src = MANIKINS_IMAGE;
}

function showRating(i, pictureDurationMs) {
  clear();
  state.phase = "ratings";
  const trial = CONFIG.trials[state.order[i]];
  const screen = document.createElement("div");
  screen.className = "rating-screen";
  const layout = document.createElement("div");
  layout.className = "rating-layout";
  const card = document.createElement("div");
  card.className = "card rating-card";
  card.innerHTML = `<h1>${UI.ratingTitle}</h1><p>${UI.ratingHint}</p>`;
  const answers = {};
  let onset = null, advanced = false;
  const next = document.createElement("button");
  next.id = "rating-next";
  next.className = "btn";
  next.textContent = UI.next;
  next.disabled = true;
  const ready = () => onset !== null && RATING_SCALES.every(s =>
    Number.isInteger(answers[s.key]) && answers[s.key] >= 1 && answers[s.key] <= 9);

  for (const scale of RATING_SCALES) {
    const fieldset = document.createElement("fieldset");
    fieldset.className = `rating-scale${scale.manikin ? " sam" : ""}`;
    const legend = document.createElement("legend");
    legend.textContent = scale.label;
    const question = document.createElement("p");
    question.id = `rating-${scale.key}-description`;
    question.textContent = scale.question + (scale.midpoint ? ` ${scale.midpoint}.` : "");
    fieldset.setAttribute("aria-describedby", question.id);
    const choices = document.createElement("div");
    choices.className = "rating-choices";
    const values = Array.from({ length: 9 }, (_, index) => 9 - index);
    for (const n of values) {
      const label = document.createElement("label");
      label.className = "rating-choice";
      const input = document.createElement("input");
      input.type = "radio"; input.name = `rating-${scale.key}`; input.value = String(n);
      input.id = `rating-${scale.key}-${n}`;
      input.setAttribute("aria-label", `${n}${n === 1 ? ': ' + scale.low : n === 9 ? ': ' + scale.high : ''}`);
      input.addEventListener("change", () => {
        if (onset === null || advanced || !input.checked) return;
        answers[scale.key] = n;
        next.disabled = !ready();
      });
      const number = document.createElement("span");
      number.textContent = String(n);
      label.appendChild(input); label.appendChild(number); choices.appendChild(label);
    }
    const anchors = document.createElement("div");
    anchors.className = "rating-anchors";
    const anchorTexts = [`9 — ${scale.high}`, `1 — ${scale.low}`];
    for (const text of anchorTexts) {
      const anchor = document.createElement("span"); anchor.textContent = text; anchors.appendChild(anchor);
    }
    fieldset.appendChild(legend); fieldset.appendChild(question);
    if (scale.manikin) {
      const illustration = document.createElement("div");
      illustration.className = `sam-illustration ${scale.key}`;
      const image = document.createElement("img");
      image.src = MANIKINS_IMAGE;
      image.alt = `${scale.label}: 9 — ${scale.high}; 1 — ${scale.low}.`;
      illustration.appendChild(image);
      fieldset.appendChild(illustration);
    }
    fieldset.appendChild(choices); fieldset.appendChild(anchors); card.appendChild(fieldset);
  }
  next.addEventListener("click", () => {
    if (advanced || !ready()) return;
    advanced = true; next.disabled = true;
    state.pictureRatings.push({ position: i + 1, mappingPosition: i + 1,
      ...blockMetadata(i),
      variable: trial.variable, image: trial.image,
      valence: answers.valence, arousal: answers.arousal, relevance: answers.relevance,
      pictureDurationMs,
      ratingDurationMs: Math.round(performance.now() - onset) });
    if (i + 1 >= state.order.length) screenEnd();
    else showRatingPreparation(i + 1);
  });
  card.appendChild(next);
  layout.appendChild(card); screen.appendChild(layout); app.appendChild(screen);
  onset = performance.now();
}

/* ------------------------------ end / export ------------------------------ */
function buildDataset() {
  const mapRecord = (t, position) => {
    const m = state.meta[t.variable] || {};
    let output = null, parsed = null;
    if (state.results[t.variable] != null) {
      output = state.results[t.variable];
      try { parsed = JSON.parse(output); } catch (e) { parsed = null; }
    }
    return {
      position,
      ...(position === 0
        ? { block: null, condition: null, blockPosition: null, positionWithinBlock: null }
        : blockMetadata(position - 1)),
      variable: t.variable,
      image: t.image,
      persona: m.persona,
      mapDurationMs: m.mapDurationMs ?? null,
      responded: output != null,
      output: parsed              // full InteroMap structure, or null if nothing drawn
    };
  };
  const trials = state.order.map((ti, pos) => mapRecord(CONFIG.trials[ti], pos + 1));
  return {
    schemaVersion: 5,
    consent: state.consent,
    practice: state.practice,
    bodyMapBrush: { size: 32, label: "medium", fixed: true },
    randomization: {
      method: "fisher-yates-blocks-and-within-blocks",
      blockOrder: [...new Set(state.order.map(index => CONFIG.trials[index].block))],
      ratingOrder: "same-as-mapping"
    },
    participant: state.participant,
    timestamp: new Date().toISOString(),
    lang: CONFIG.lang,
    baseline: state.meta[BASELINE.variable] ? { ...mapRecord(BASELINE, 0), type: "baseline" } : null,
    bodyMapScales: {
      min: 1, max: 9, step: 1, storedValuesMatchLabels: true,
      valence: { low: "Velmi nepříjemný", midpoint: "Neutrální", midpointValue: 5, high: "Velmi příjemný" },
      intensity: { low: "Velmi slabá", high: "Velmi silná", construct: "bodily sensation intensity" }
    },
    trials,
    pictureRatings: state.pictureRatings,
    ratingScales: { responseFormat: "sam-valence-arousal-numeric-relevance", min: 1, max: 9,
      manikinsImage: MANIKINS_IMAGE, manikinDisplayOrder: "9-to-1", relevanceDisplayOrder: "9-to-1",
      pictureMs: CONFIG.ratingPictureMs, preparationMs: CONFIG.ratingPreparationMs,
      intensityConstruct: "arousal", relevanceConstruct: "personal relevance",
      presentationOrder: "same as mapping", scales: RATING_SCALES }
  };
}

/* long CSV: one row per stroke (+ one row for empty trials) */
function toCSV(dataset) {
  const head = ["participant","timestamp","position","variable","image","persona",
                "map_duration_ms","picture_valence_1_9","picture_arousal_1_9","picture_relevance_1_9",
                "rating_duration_ms","rating_position","map_type","block","condition","block_position","position_within_block",
                "consent_accepted","consent_version","consent_accepted_at","practice_completed","persona_view","stroke_index","valence","intensity",
                "brush_color","brush_size","n_points","points_json"];
  const esc = v => {
    const s = (v == null) ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const rows = [head.join(",")];
  const maps = dataset.baseline ? [dataset.baseline, ...dataset.trials] : dataset.trials;
  for (const tr of maps) {
    const rating = (dataset.pictureRatings || []).find(r => r.variable === tr.variable) || {};
    const base = [dataset.participant, dataset.timestamp, tr.position, tr.variable,
                  tr.image, tr.persona, tr.mapDurationMs, rating.valence, rating.arousal,
                  rating.relevance, rating.ratingDurationMs, rating.position,
                  tr === dataset.baseline ? "baseline" : "picture",
                  tr.block, tr.condition, tr.blockPosition, tr.positionWithinBlock,
                  dataset.consent?.accepted, dataset.consent?.version, dataset.consent?.acceptedAt,
                  dataset.practice?.completed];
    if (!tr.output) { rows.push([...base, "", "", "", "", "", "", "0", ""].map(esc).join(",")); continue; }
    let any = false;
    for (const view of Object.keys(tr.output)) {
      const strokes = (tr.output[view] && tr.output[view].strokes) || [];
      strokes.forEach((s, si) => {
        any = true;
        rows.push([...base, view, si, s.valence, s.intensity, s.brushColor, s.brushSize,
                   (s.points ? s.points.length : 0), JSON.stringify(s.points)].map(esc).join(","));
      });
    }
    if (!any) rows.push([...base, "", "", "", "", "", "", "0", ""].map(esc).join(","));
  }
  return rows.join("\n");
}

function download(name, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const PENDING_KEY = "interomap.pending-submission.v1";
let completedSubmission = null;
let uploadInProgress = false;
let uploadSaved = false;

function saveAll() {
  const ds = completedSubmission.dataset;
  const pid = (ds.participant || "anon").replace(/[^A-Za-z0-9_-]/g, "");
  const stamp = ds.timestamp.replace(/[:.]/g, "-");
  const base = `interomap_${pid}_${stamp}`;
  download(base + ".json", JSON.stringify(ds, null, 2), "application/json");
  download(base + ".csv", toCSV(ds), "text/csv");
  return ds;
}

function screenEnd() {
  clear();
  state.phase = "complete";
  prog.textContent = "";
  if (!completedSubmission) {
    completedSubmission = { submissionId: crypto.randomUUID(), dataset: buildDataset() };
  }
  // Survive a refresh in this tab; never retain successfully uploaded data here.
  try { sessionStorage.setItem(PENDING_KEY, JSON.stringify(completedSubmission)); } catch (e) {}
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h1>${UI.title}</h1><p>${UI.finished}</p>`;
  const status = document.createElement("p");
  status.id = "upload-status";
  status.setAttribute("role", "status");
  status.setAttribute("aria-live", "polite");
  card.appendChild(status);
  const retry = document.createElement("button");
  retry.id = "upload-retry";
  retry.className = "btn";
  retry.textContent = UI.retry;
  retry.hidden = true;
  retry.addEventListener("click", uploadResults);
  card.appendChild(retry);
  const b = document.createElement("button");
  b.id = "upload-backup";
  b.className = "btn secondary"; b.textContent = UI.download;
  b.hidden = true;
  b.addEventListener("click", saveAll);
  card.appendChild(b);
  app.appendChild(card);
  void uploadResults();
}

async function uploadResults() {
  if (uploadInProgress || uploadSaved || !completedSubmission) return;
  uploadInProgress = true;
  const status = document.getElementById("upload-status");
  const retry = document.getElementById("upload-retry");
  const backup = document.getElementById("upload-backup");
  status.textContent = UI.uploading;
  retry.hidden = true;
  backup.hidden = true;
  const body = JSON.stringify(completedSubmission);
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);
      let permanentFailure = false;
      try {
        const response = await fetch(CONFIG.uploadUrl, {
          method: "POST", headers: { "Content-Type": "application/json" },
          credentials: "omit", body, signal: controller.signal
        });
        permanentFailure = response.status >= 400 && response.status < 500 &&
          response.status !== 408 && response.status !== 429;
        if (!response.ok) throw new Error("Upload rejected");
        const receipt = await response.json();
        if (receipt.saved !== true || receipt.submissionId !== completedSubmission.submissionId) {
          permanentFailure = true;
          throw new Error("Invalid upload receipt");
        }
        uploadSaved = true;
        try { sessionStorage.removeItem(PENDING_KEY); } catch (e) {}
        status.textContent = UI.uploaded;
        return;
      } catch (error) {
        if (permanentFailure || attempt === 2) throw error;
      } finally { clearTimeout(timeout); }
      await new Promise(resolve => setTimeout(resolve, attempt === 0 ? 2000 : 5000));
    }
  } catch (error) {
    status.textContent = UI.uploadFailed;
    retry.hidden = false;
    backup.hidden = false;
  } finally { uploadInProgress = false; }
}

window.addEventListener("beforeunload", event => {
  if ((completedSubmission && !uploadSaved) || ["baselineIntro", "baseline", "mapping", "ratingIntro", "ratingPicture", "ratings", "ratingPreparation"].includes(state.phase)) {
    event.preventDefault(); event.returnValue = "";
  }
});
window.addEventListener("online", () => { if (completedSubmission && !uploadSaved) void uploadResults(); });

try {
  const pending = JSON.parse(sessionStorage.getItem(PENDING_KEY));
  if (pending && typeof pending.submissionId === "string" && pending.dataset &&
      Array.isArray(pending.dataset.trials)) completedSubmission = pending;
} catch (e) {}
if (completedSubmission) screenEnd(); else screenConsent();
